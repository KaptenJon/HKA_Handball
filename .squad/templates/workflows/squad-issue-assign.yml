name: Squad Issue Assign

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  process:
    if: github.event.label.name == 'squad' || startsWith(github.event.label.name, 'squad:')
    uses: ./.github/workflows/issue-agent-pipeline.yml
    with:
      issue_number: ${{ format('{0}', github.event.issue.number) }}
    secrets: inherit
