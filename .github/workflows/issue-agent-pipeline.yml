name: Issue Agent Pipeline

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: issue-agent-pipeline-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Label opened issue as squad
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: "squad" });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: "squad",
                  color: "9B8FCC",
                  description: "Squad triage inbox"
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ["squad"]
            });

      - name: Wait 2 hours
        run: sleep 7200

      - name: Merge linked PR if all checks are green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;

            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const linkedPrNumbers = [...new Set(
              timeline
                .filter(event => event.event === "cross-referenced" && event.source?.issue?.pull_request)
                .filter(event => event.source?.issue?.repository?.full_name === `${owner}/${repo}`)
                .map(event => event.source.issue.number)
            )];

            if (linkedPrNumbers.length === 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: "No linked pull request found after 2 hours, so nothing was merged."
              });
              return;
            }

            let candidatePr = null;
            for (const prNumber of linkedPrNumbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });
              if (pr.state === "open") {
                candidatePr = pr;
                break;
              }
            }

            if (!candidatePr) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: "Linked pull request(s) were found, but none are open to merge."
              });
              return;
            }

            if (candidatePr.draft) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `PR #${candidatePr.number} is still a draft, so it was not merged.`
              });
              return;
            }

            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: candidatePr.head.sha
            });

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: candidatePr.head.sha,
              per_page: 100
            });

            const statusGreen = combinedStatus.state === "success";
            const checksGreen = checkRuns.every(run =>
              run.status === "completed" &&
              ["success", "neutral", "skipped"].includes(run.conclusion || "")
            );

            if (!statusGreen || !checksGreen) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `PR #${candidatePr.number} is not fully green yet, so it was not merged.`
              });
              return;
            }

            try {
              const { data: mergeResult } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: candidatePr.number,
                merge_method: "squash"
              });

              if (mergeResult.merged) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `✅ PR #${candidatePr.number} was automatically merged after 2 hours because all checks were green.`
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `PR #${candidatePr.number} was not merged: ${mergeResult.message || "merge rejected"}.`
                });
              }
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `PR #${candidatePr.number} could not be merged automatically: ${error.message}`
              });
              throw error;
            }
