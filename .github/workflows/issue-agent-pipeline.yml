name: Issue Agent Pipeline

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process or retry
        required: true
        type: string
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
    secrets:
      COPILOT_ASSIGN_TOKEN:
        required: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    uses: ./.github/workflows/squad-triage.yml
    with:
      issue_number: ${{ inputs.issue_number || format('{0}', github.event.issue.number) }}

  start-work:
    needs: triage
    uses: ./.github/workflows/squad-start-work.yml
    with:
      issue_number: ${{ inputs.issue_number || format('{0}', github.event.issue.number) }}
    secrets: inherit

  report-triage-failure:
    needs: triage
    if: ${{ always() && needs.triage.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || format('{0}', github.event.issue.number) }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              throw new Error('Cannot report triage failure: invalid issue_number');
            }
            const params = { ...context.repo, issue_number: issueNumber };
            const marker = '<!-- squad-execution-status -->';
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            const body = `${marker}\n**Squad triage failed:** inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}), resolve the error and run Issue Agent Pipeline again.`;
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
