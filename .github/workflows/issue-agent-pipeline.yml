name: Issue Agent Pipeline

on:
  issues:
    types: [opened]

permissions:
  contents: none
  pull-requests: read
  issues: write

concurrency:
  group: issue-agent-pipeline-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan-issue:
    name: Plan issue (agent)
    runs-on: ubuntu-latest
    outputs:
      plan_prompt: ${{ steps.plan.outputs.plan_prompt }}
    steps:
      - name: Build plan prompt for planner agent
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const prompt = [
              "Agent: issue-planner",
              `Issue #${issue.number}: ${issue.title}`,
              "",
              "Issue body:",
              issue.body || "(no body)",
              "",
              "Create an implementation plan using the agent's output format."
            ].join("\n");

            core.setOutput("plan_prompt", prompt);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "Starting automated issue pipeline.",
                "- Planner agent queued: `issue-planner`"
              ].join("\n")
            });

  validate-handball:
    name: Validate sports logic (agent)
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      validation_summary: ${{ steps.validate.outputs.validation_summary }}
    steps:
      - name: Validate issue from handball perspective
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();

            // Lightweight heuristic gate; handball agent should provide the final judgment in practice.
            const handballTerms = [
              "handball", "goalkeeper", "pivot", "wing", "6m", "9m", "7m",
              "free throw", "penalty", "passive play", "fast break", "defense", "offense"
            ];

            const hasSportContext = handballTerms.some(term => text.includes(term));
            const valid = hasSportContext ? "true" : "false";
            const summary = hasSportContext
              ? "VALID: Sports context detected."
              : "INVALID: No clear handball context detected. Add sport-specific details.";

            core.setOutput("valid", valid);
            core.setOutput("validation_summary", summary);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "Handball knowledge validation complete.",
                `- Result: ${summary}`
              ].join("\n")
            });

  gate:
    name: Gate after parallel checks
    runs-on: ubuntu-latest
    needs: [plan-issue, validate-handball]
    if: always()
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Decide whether to proceed
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const validationJobSucceeded = "${{ needs['validate-handball'].result }}" === "success";
            const valid = validationJobSucceeded && "${{ needs['validate-handball'].outputs.valid }}" === "true";
            const proceed = valid ? "true" : "false";
            core.setOutput("proceed", proceed);

            const issue = context.payload.issue;
            const statusBody = valid
              ? "Parallel checks passed. Proceeding with coding agents."
              : "Pipeline stopped: sports validation failed. Please refine issue details and reopen.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: statusBody
            });

  implementation-agent:
    name: Implementation coder (agent)
    runs-on: ubuntu-latest
    needs: [gate, plan-issue]
    if: needs.gate.outputs.proceed == 'true'
    steps:
      - name: Trigger implementation coding agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          PLAN_PROMPT: ${{ needs['plan-issue'].outputs.plan_prompt }}
        with:
          script: |
            const issue = context.payload.issue;
            const planPrompt = process.env.PLAN_PROMPT || "(planner output unavailable)";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "@copilot Please use the `implementation-coder` custom agent.",
                `Implement the approved plan for issue #${issue.number} and open a pull request.`,
                `Include "Fixes #${issue.number}" in the PR description so the pipeline can find it.`,
                "When implementation is complete, add the exact comment marker `<!-- hka-agent-complete: implementation -->` to the PR. If blocked, add `<!-- hka-agent-failed: implementation -->` instead.",
                "",
                "Planner context:",
                planPrompt
              ].join("\n")
            });

  wait-for-pr:
    name: Wait for PR from agents
    runs-on: ubuntu-latest
    needs: [implementation-agent]
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
    steps:
      - name: Find PR linked to issue
        id: find-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Retry to give coding agents time to open an associated, open PR.
            for (let i = 0; i < 20; i++) {
              core.info(`Checking for linked PR (attempt ${i + 1}/20)`);
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });

              const references = timeline
                .filter(event => event.event === "cross-referenced" && event.source?.issue?.pull_request)
                .map(event => event.source.issue.number);

              for (const prNumber of [...new Set(references)]) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const expectedReference = new RegExp(
                  `\\b(?:fix(?:e[sd])?|close[sd]?|resolve[sd]?)\\s+#${issueNumber}\\b`,
                  "i"
                );
                if (pr.state === "open" && expectedReference.test(pr.body || "")) {
                  core.info(`Found open PR #${pr.number} with an expected issue reference`);
                  core.setOutput("pr_number", String(pr.number));
                  return;
                }
              }

              if (i < 19) {
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }

            core.setFailed("No open PR associated with this issue and an expected Fixes/Closes/Resolves reference was found within the timeout.");

  wait-for-implementation:
    name: Wait for implementation completion
    runs-on: ubuntu-latest
    needs: [wait-for-pr]
    steps:
      - name: Wait for implementation completion marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const successMarker = "<!-- hka-agent-complete: implementation -->";
            const failureMarker = "<!-- hka-agent-failed: implementation -->";

            for (let attempt = 1; attempt <= 20; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const bodies = comments.map(comment => comment.body || "");
              if (bodies.some(body => body.includes(failureMarker))) {
                core.setFailed("Implementation agent reported failure.");
                return;
              }
              if (bodies.some(body => body.includes(successMarker))) {
                core.info("Implementation agent completion is observable.");
                return;
              }
              core.info(`Waiting for implementation completion (attempt ${attempt}/20)`);
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed("Timed out waiting for the implementation completion marker.");

  ui-polish-agent:
    name: UI polish coder (agent)
    runs-on: ubuntu-latest
    needs: [wait-for-implementation]
    steps:
      - name: Request UI polish pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            if (Number.isNaN(prNumber)) {
              core.setFailed("PR number was not set by wait-for-pr job.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                "@copilot Please run a second pass with the `ui-polish-coder` custom agent.",
                "Focus on visual and UX polish after core implementation, update this PR, then add the exact comment marker `<!-- hka-agent-complete: ui-polish -->`. If blocked, add `<!-- hka-agent-failed: ui-polish -->`."
              ].join("\n")
            });

  review-agent:
    name: Review agent pass
    runs-on: ubuntu-latest
    needs: [wait-for-ui-polish]
    steps:
      - name: Trigger review agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            if (Number.isNaN(prNumber)) {
              core.setFailed("PR number was not set by wait-for-pr job.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                "@copilot Please use the `pr-reviewer` custom agent.",
                "Review this PR for correctness and maintainability, leave actionable comments, then add the exact comment marker `<!-- hka-agent-complete: review -->`. If blocked, add `<!-- hka-agent-failed: review -->`."
              ].join("\n")
            });

  wait-for-ui-polish:
    name: Wait for UI polish completion
    runs-on: ubuntu-latest
    needs: [ui-polish-agent, wait-for-pr]
    steps:
      - name: Wait for UI polish completion marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const successMarker = "<!-- hka-agent-complete: ui-polish -->";
            const failureMarker = "<!-- hka-agent-failed: ui-polish -->";

            for (let attempt = 1; attempt <= 20; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const bodies = comments.map(comment => comment.body || "");
              if (bodies.some(body => body.includes(failureMarker))) {
                core.setFailed("UI polish agent reported failure.");
                return;
              }
              if (bodies.some(body => body.includes(successMarker))) return;
              core.info(`Waiting for UI polish completion (attempt ${attempt}/20)`);
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed("Timed out waiting for the UI polish completion marker.");

  fix-comments-agent:
    name: Fix review comments
    runs-on: ubuntu-latest
    needs: [wait-for-review, wait-for-pr]
    steps:
      - name: Trigger comment-fixing agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            if (Number.isNaN(prNumber)) {
              core.setFailed("PR number was not set by wait-for-pr job.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                "@copilot Please use the `review-comment-fixer` custom agent.",
                "Resolve open review comments and update this PR until merge-ready, then add the exact comment marker `<!-- hka-agent-complete: fix-comments -->`. If blocked, add `<!-- hka-agent-failed: fix-comments -->`."
              ].join("\n")
            });

  wait-for-review:
    name: Wait for review completion
    runs-on: ubuntu-latest
    needs: [review-agent, wait-for-pr]
    steps:
      - name: Wait for review completion marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const successMarker = "<!-- hka-agent-complete: review -->";
            const failureMarker = "<!-- hka-agent-failed: review -->";
            for (let attempt = 1; attempt <= 20; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const bodies = comments.map(comment => comment.body || "");
              if (bodies.some(body => body.includes(failureMarker))) {
                core.setFailed("Review agent reported failure.");
                return;
              }
              if (bodies.some(body => body.includes(successMarker))) return;
              core.info(`Waiting for review completion (attempt ${attempt}/20)`);
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed("Timed out waiting for the review completion marker.");

  pipeline-complete:
    name: Complete agent pipeline
    runs-on: ubuntu-latest
    needs: [wait-for-fix-comments, wait-for-pr]
    steps:
      - name: Report completion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            if (Number.isNaN(prNumber)) {
              core.setFailed("PR number was not set by wait-for-pr job.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: "✅ Issue agent pipeline completed. The PR is ready for maintainer review; automatic merging is intentionally not enabled."
            });

  wait-for-fix-comments:
    name: Wait for comment-fixing completion
    runs-on: ubuntu-latest
    needs: [fix-comments-agent, wait-for-pr]
    steps:
      - name: Wait for comment-fixing completion marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const prNumber = Number("${{ needs['wait-for-pr'].outputs.pr_number }}");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const successMarker = "<!-- hka-agent-complete: fix-comments -->";
            const failureMarker = "<!-- hka-agent-failed: fix-comments -->";
            for (let attempt = 1; attempt <= 20; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const bodies = comments.map(comment => comment.body || "");
              if (bodies.some(body => body.includes(failureMarker))) {
                core.setFailed("Comment-fixing agent reported failure.");
                return;
              }
              if (bodies.some(body => body.includes(successMarker))) return;
              core.info(`Waiting for comment-fixing completion (attempt ${attempt}/20)`);
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed("Timed out waiting for the comment-fixing completion marker.");
