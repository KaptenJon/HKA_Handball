name: Squad Reviewed Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: squad-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      # Only trusted base-branch automation is executed; never check out PR code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enable auto-merge for reviewed Squad PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            const enableAutoMerge = require('./.github/scripts/squad-auto-merge.cjs');
            await enableAutoMerge({ github, context, core });
