name: Build Android

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  automation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 #v6
        with:
          node-version: '24'
      - name: Validate Squad automation contracts
        run: node --test .github/scripts/squad-automation.test.cjs

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Install MAUI workload
      run: dotnet workload install maui-android

    - name: Restore
      run: dotnet restore HKA_Handball/HKA_Handball.csproj

    - name: Build Android Debug
      run: dotnet build HKA_Handball/HKA_Handball.csproj -f net10.0-android -c Debug --no-restore

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: android-debug-apk
        path: HKA_Handball/bin/Debug/net10.0-android/*.apk
        retention-days: 14
