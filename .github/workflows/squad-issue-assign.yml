name: Squad Issue Assign

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign-work:
    # Only trigger on squad:{member} labels (not the base "squad" label)
    if: startsWith(github.event.label.name, 'squad:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Identify assigned member and trigger work
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const label = context.payload.label.name;
            const slugify = value => value
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
            const findMemberBySlug = (lines, memberName) => {
              let inMembersTable = false;
              const matches = [];
              for (const line of lines) {
                if (line.match(/^##\s+(Members|Team Roster)/i)) {
                  inMembersTable = true;
                  continue;
                }
                if (inMembersTable && line.startsWith('## ')) break;
                if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                  const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                  if (cells.length >= 2 && slugify(cells[0]) === memberName) {
                    matches.push({ name: cells[0], role: cells[1] });
                  }
                }
              }
              return {
                member: matches.length === 1 ? matches[0] : null,
                ambiguous: matches.length > 1,
              };
            };

            // Extract member name from label (e.g., "squad:ripley" → "ripley")
            const memberName = label.replace('squad:', '').toLowerCase();

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot assign work');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            // Check if this is a coding agent assignment
            const isCopilotAssignment = memberName === 'copilot';

            let assignedMember = null;
            if (isCopilotAssignment) {
              assignedMember = { name: '@copilot', role: 'Coding Agent' };
            } else {
              const match = findMemberBySlug(lines, memberName);
              assignedMember = match.member;
              if (match.ambiguous) {
                core.warning(`Multiple squad members map to label "${label}" — refusing ambiguous assignment`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⚠️ Multiple squad members map to label \`${label}\`. Rename the colliding members in \`.squad/team.md\` before assigning work.`
                });
                return;
              }
            }

            if (!assignedMember) {
              core.warning(`No member found matching label "${label}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ No squad member found matching label \`${label}\`. Check \`.squad/team.md\` for valid member names.`
              });
              return;
            }

            // Post assignment acknowledgment
            let comment;
            if (isCopilotAssignment) {
              comment = [
                `### 🤖 Routed to @copilot (Coding Agent)`,
                '',
                `**Issue:** #${issue.number} — ${issue.title}`,
                '',
                `@copilot has been assigned and will pick this up automatically.`,
                '',
                `> The coding agent will create a \`copilot/*\` branch and open a draft PR.`,
                `> Review the PR as you would any team member's work.`,
              ].join('\n');
            } else {
              comment = [
                `### 📋 Assigned to ${assignedMember.name} (${assignedMember.role})`,
                '',
                `**Issue:** #${issue.number} — ${issue.title}`,
                '',
                `${assignedMember.name} will pick this up in the next Copilot session.`,
                '',
                `> **For Copilot coding agent:** If enabled, this issue will be worked automatically.`,
                `> Otherwise, start a Copilot session and say:`,
                `> \`${assignedMember.name}, work on issue #${issue.number}\``,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Issue #${issue.number} assigned to ${assignedMember.name} (${assignedMember.role})`);

      # Copilot is triggered by an issue comment. Do not call the unsupported
      # Copilot agent-assignment API or require a separate PAT.
      - name: Assign @copilot coding agent
        if: github.event.label.name == 'squad:copilot'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (comments.some(comment => comment.body?.includes('<!-- squad-copilot-requested -->'))) {
              core.info(`A shared Copilot request already exists for #${issue.number}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "<!-- squad-copilot-requested -->",
                "@copilot Please work on this issue using the appropriate custom agent.",
                "Create a pull request with `Fixes #" + issue.number + "` in the description."
              ].join("\n")
            });
